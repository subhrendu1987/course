<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Site Redirection Notice</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Font: Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f3f4f6; /* Light gray background */
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 1rem; /* Add some padding for smaller screens */
            box-sizing: border-box; /* Include padding in element's total width and height */
        }
    </style>
</head>
<body class="antialiased">
    <div class="bg-white p-8 md:p-12 rounded-xl shadow-lg max-w-md w-full text-center border border-gray-200">
        <h1 class="text-3xl md:text-4xl font-bold text-gray-800 mb-4">Redirecting Soon...</h1>
        <p class="text-gray-600 text-lg mb-6">
            You are being redirected to our new website.
        </p>
        <p class="text-gray-700 text-2xl font-semibold mb-8">
            Redirecting in <span id="countdown" class="text-indigo-600">5</span> seconds.
        </p>
        <button id="redirectButton" class="bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3 px-6 rounded-lg shadow-md transition duration-300 ease-in-out transform hover:scale-105 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:ring-opacity-75">
            Redirect Now
        </button>
        <p class="text-gray-500 text-sm mt-6">
            If you are not redirected automatically, please click the button above.
        </p>
    </div>

    <script>
        // Get the countdown element and the redirect button
        const countdownElement = document.getElementById('countdown');
        const redirectButton = document.getElementById('redirectButton');

        // Set the initial countdown time
        let timeLeft = 5; // Seconds

        // Define the URL to redirect to
        const redirectUrl = 'https://suchat-subho.github.io/course/timetable/'; // Updated to the new URL

        /**
         * Updates the countdown display and handles redirection.
         */
        function updateCountdown() {
            countdownElement.textContent = timeLeft;

            if (timeLeft <= 0) {
                // If countdown reaches 0 or less, redirect
                window.location.href = redirectUrl;
            } else {
                // Decrement time and schedule the next update
                timeLeft--;
                setTimeout(updateCountdown, 1000); // Call again after 1 second
            }
        }

        /**
         * Handles the click event for the "Redirect Now" button.
         */
        redirectButton.addEventListener('click', () => {
            window.location.href = redirectUrl;
        });

        // Start the countdown when the page loads
        document.addEventListener('DOMContentLoaded', updateCountdown);
    </script>
</body>
</html>
