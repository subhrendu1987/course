<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Settings</title>

<link rel="icon" href="assets/favicon.png">
<link rel="stylesheet" href="css/style.css">

</head>

<body>

<header id="topbar">

<div class="logo">

YOLO Annotator Settings

</div>

<div class="toolbar">

<a href="index.html">

<button>Home</button>

</a>

<a href="annotate.html">

<button>Annotator</button>

</a>

<button id="saveSettingsBtn">

Save Settings

</button>

</div>

</header>

<main class="settings">

<section class="card">

<h2>Dataset</h2>

<label>

Images Folder

</label>

<input
id="imagesFolder"
type="text"
value="images">

<label>

Labels Folder

</label>

<input
id="labelsFolder"
type="text"
value="labels">

<label>

Preview Folder

</label>

<input
id="previewFolder"
type="text"
value="preview">

</section>

<section class="card">

<h2>Classes</h2>

<table id="classTable">

<thead>

<tr>

<th>ID</th>

<th>Name</th>

</tr>

</thead>

<tbody>

<tr>

<td>0</td>

<td>

<input
type="text"
value="Person">

</td>

</tr>

</tbody>

</table>

<button id="addClassBtn">

Add Class

</button>

</section>

<section class="card">

<h2>Annotation</h2>

<label>

Bounding Box Color

</label>

<input
type="color"
id="boxColor"
value="#FCBA03">

<label>

Selected Box Color

</label>

<input
type="color"
id="selectedColor"
value="#00FF00">

<label>

Line Width

</label>

<input
type="number"
id="lineWidth"
value="2">

<label>

Show Numbers

</label>

<input
type="checkbox"
id="showNumbers"
checked>

</section>

<section class="card">

<h2>Editor</h2>

<label>

Auto Save

</label>

<input
type="checkbox"
id="autosave"
checked>

<label>

Auto Save Interval (seconds)

</label>

<input
type="number"
id="autosaveInterval"
value="30">

<label>

Default Zoom

</label>

<input
type="number"
id="defaultZoom"
value="100">

</section>

<section class="card">

<h2>Google Apps Script</h2>

<label>

Apps Script URL

</label>

<textarea
id="gasURL"
rows="4"
placeholder="https://script.google.com/macros/s/...">
</textarea>

</section>

<section class="card">

<h2>Export</h2>

<label>

Export Format

</label>

<select id="exportFormat">

<option>

YOLO

</option>

<option>

JSON

</option>

<option>

YOLO + JSON

</option>

</select>

<label>

Export Preview Image

</label>

<input
type="checkbox"
id="exportPreview">

</section>

</main>

<footer id="statusbar">

Ready

</footer>

<script type="module" src="js/settings.js"></script>

</body>
</html>
